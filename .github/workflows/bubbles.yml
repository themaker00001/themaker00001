name: Bubble contribution graph

on:
  schedule:
    - cron: "0 3 * * *" # daily at 03:00 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/generate-bubbles.mjs"
      - ".github/workflows/bubbles.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate bubble graph
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_LOGIN: themaker00001
        run: node scripts/generate-bubbles.mjs

      - name: Publish to output branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git fetch origin output || true
          if git show-ref --verify --quiet refs/remotes/origin/output; then
            git worktree add /tmp/output-branch output
          else
            git worktree add --orphan -B output /tmp/output-branch
          fi

          cp dist/bubble-contrib-light.svg dist/bubble-contrib-dark.svg /tmp/output-branch/
          cd /tmp/output-branch
          git add bubble-contrib-light.svg bubble-contrib-dark.svg
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh bubble contribution graph"
            git push origin HEAD:output
          else
            echo "No changes to bubble graph, skipping push."
          fi
